version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    groups:
      github-actions:
        patterns:
          - "*"  # Group all Action updates into a single larger pull request
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
