[tox]
envlist =
    py{310,311,312,313,314}-dj52
    py{312,313,314}-dj60
skipsdist = True

[testenv]
deps =
    dj52: Django>=5.2,<6.0
    dj60: Django>=6.0,<6.1

    djangorestframework
    openpyxl
    Pillow

    pytest
    pytest-django
    pytest-cov
    django-coverage-plugin
    time-machine

commands = {posargs:python -m pytest}
